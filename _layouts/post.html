<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - sa scratchpad</title>
    <style>
        :root { --bg: #ffffff; --text: #111111; --muted: #666666; }
        @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #e0e0e0; --muted: #a0a0a0; } }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        header a { text-decoration: none; color: var(--muted); font-size: 0.9rem; font-weight: 600; text-transform: lowercase; }
        header a:hover { text-decoration: underline; }
        .post-date { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; display: block; margin-top: 40px; margin-bottom: 8px; }
        h1 { font-size: 1.75rem; font-weight: 700; margin-top: 0; margin-bottom: 24px; line-height: 1.2; }
    </style>
</head>
<body>
    <header><a href="/">&larr; sa scratchpad</a></header>
    <main>
        <span class="post-date">{{ page.date | date: "%b %d, %Y" | upcase }}</span>
        <h1>{{ page.title }}</h1>
        {{ content }}
    </main>
</body>
</html>
